services:
  postgres:
    image: postgres:15-alpine
    container_name: aiws_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aiws_user
      POSTGRES_PASSWORD: aiws_pass
      POSTGRES_DB: aiws_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aiws_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
